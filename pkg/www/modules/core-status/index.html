<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modbus Core Status</title>
  <style>
    :root {
      --bg: #f3efe6;
      --panel: #fffaf2;
      --ink: #1f2a2e;
      --muted: #66757f;
      --accent: #b5532f;
      --line: #d8c9b4;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, rgba(181, 83, 47, 0.12), transparent 28%),
        linear-gradient(180deg, #f8f4ec 0%, var(--bg) 100%);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .panel {
      width: min(860px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(31, 42, 46, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    pre {
      margin: 0;
      min-height: 240px;
      overflow: auto;
      background: #201d1a;
      color: #f8f2e8;
      border-radius: 14px;
      padding: 18px;
      line-height: 1.45;
      border: 1px solid rgba(216, 201, 180, 0.2);
    }

    .badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(181, 83, 47, 0.12);
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="badge">Foundation build</div>
    <h1>Modbus Core Status</h1>
    <p>Base runtime snapshot from <code>/tmp/modbus/cache.json</code>. This page is meant for bring-up and service validation.</p>
    <pre id="output">Loading status...</pre>
  </main>
  <script>
    const output = document.getElementById('output');

    async function refresh() {
      try {
        const response = await fetch('/cgi-bin/modbus-core-status', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const payload = await response.json();
        output.textContent = JSON.stringify(payload, null, 2);
      } catch (error) {
        output.textContent = `Status fetch failed: ${error.message}`;
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
