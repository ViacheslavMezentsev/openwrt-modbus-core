<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modbus Demo Module</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #13212b;
      --muted: #6b7a89;
      --accent: #0f766e;
      --line: #d7e1ec;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Verdana, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.12), transparent 35%),
        linear-gradient(180deg, #eef5fb 0%, var(--bg) 100%);
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .panel {
      width: min(920px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 22px 60px rgba(19, 33, 43, 0.09);
    }

    header {
      padding: 24px;
      background: linear-gradient(135deg, #0f766e, #1d4ed8);
      color: #fff;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 40px);
    }

    p {
      margin: 0;
      opacity: 0.9;
    }

    .body {
      padding: 24px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfdff;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .value {
      font-size: 18px;
      font-weight: 700;
    }

    pre {
      margin: 0;
      background: #0f172a;
      color: #dbeafe;
      border-radius: 16px;
      padding: 18px;
      min-height: 220px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <main class="panel">
    <header>
      <h1>Modbus Demo</h1>
      <p>Subscriber module for core event diagnostics and end-to-end module bring-up.</p>
    </header>
    <section class="body">
      <div class="meta">
        <div class="card"><div class="label">Status</div><div class="value" id="status">loading</div></div>
        <div class="card"><div class="label">Processed events</div><div class="value" id="processed">0</div></div>
        <div class="card"><div class="label">Last kind</div><div class="value" id="kind">-</div></div>
        <div class="card"><div class="label">Last sequence</div><div class="value" id="sequence">0</div></div>
      </div>
      <pre id="json">Loading module status...</pre>
    </section>
  </main>
  <script>
    const el = {
      status: document.getElementById('status'),
      processed: document.getElementById('processed'),
      kind: document.getElementById('kind'),
      sequence: document.getElementById('sequence'),
      json: document.getElementById('json')
    };

    async function refresh() {
      try {
        const response = await fetch('/cgi-bin/modbus-demo-status', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        el.status.textContent = payload.status || 'unknown';
        el.processed.textContent = payload.processed_events ?? 0;
        el.kind.textContent = payload.last_kind || '-';
        el.sequence.textContent = payload.last_seq ?? 0;
        el.json.textContent = JSON.stringify(payload, null, 2);
      } catch (error) {
        el.json.textContent = `Status fetch failed: ${error.message}`;
      }
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
