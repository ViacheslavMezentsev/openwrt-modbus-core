name: CI - modbus-rtu-core

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install minimal dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 binutils make

      - name: Build, test and verify
        run: make all

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modbus-rtu-core-ipk
          path: |
            out/*.ipk
            out/checksums.sha256
